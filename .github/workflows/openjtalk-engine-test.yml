name: OpenJTalk Engine Tests

# RequiresEngine テストは jtalk.dll・辞書・音声モデルの実ファイルが必要なため
# 通常の build.yml とは分離して手動トリガー + 週次スケジュールで実行する。
#
# 注意: SourceForge の Cloudflare 制限により音声モデルの自動ダウンロードが
# 失敗する場合がある。その際は setup ステップが exit 1 となりワークフローが
# スキップ扱いになる（テスト失敗ではなく「セットアップ未完了」として記録される）。
# 自動ダウンロードが失敗した場合の対処は backlog #49 を参照。

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "キャッシュを無視して jtalk.dll を再ビルドする"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 1"  # 毎週月曜 02:00 UTC

jobs:
  openjtalk-engine-test:
    name: OpenJTalk RequiresEngine Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # jtalkdll ビルドは時間がかかるため USERPROFILE 配下のビルド成果物をキャッシュする
      - name: jtalkdll ビルドキャッシュ復元
        id: cache-jtalk
        uses: actions/cache@v4
        if: ${{ !inputs.skip_cache }}
        with:
          path: ~/openjtalk-poc-setup
          key: jtalkdll-build-${{ runner.os }}-${{ hashFiles('poc/OpenJTalkPoC/setup.ps1') }}

      - name: OpenJTalk セットアップ（jtalk.dll・辞書・音声モデル）
        id: setup
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\poc\OpenJTalkPoC\setup.ps1
        # SourceForge Cloudflare ブロックで音声モデルダウンロードに失敗した場合は
        # continue-on-error により後続のファイル存在確認ステップで判定する

      - name: セットアップ成果物を TxtToVoice/Data/openjtalk にコピー
        shell: pwsh
        run: |
          $pocData = "poc\OpenJTalkPoC\Data\openjtalk"
          $dest    = "TxtToVoice\Data\openjtalk"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # jtalk.dll（exe と同階層に配置するため Link="jtalk.dll" の Content 経由でコピーされる）
          if (Test-Path "$pocData\jtalk.dll") {
            Copy-Item "$pocData\jtalk.dll" "$dest\jtalk.dll" -Force
            Write-Host "[OK] jtalk.dll"
          }
          # 依存 DLL
          Get-ChildItem "$pocData\*.dll" -Exclude "jtalk.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_ "$dest\$($_.Name)" -Force; Write-Host "[OK] $($_.Name)" }
          # MeCab 辞書
          if (Test-Path "$pocData\open_jtalk_dic_utf_8") {
            Copy-Item "$pocData\open_jtalk_dic_utf_8" $dest -Recurse -Force
            Write-Host "[OK] open_jtalk_dic_utf_8"
          }
          # HTS Voice
          if (Test-Path "$pocData\voice") {
            Copy-Item "$pocData\voice" $dest -Recurse -Force
            Write-Host "[OK] voice"
          }

      - name: 前提ファイル確認
        id: check-files
        shell: pwsh
        run: |
          $dllOk   = Test-Path "TxtToVoice\Data\openjtalk\jtalk.dll"
          $dicOk   = Test-Path "TxtToVoice\Data\openjtalk\open_jtalk_dic_utf_8\sys.dic"
          $htsVoices = Get-ChildItem "TxtToVoice\Data\openjtalk\voice\*.htsvoice" -Recurse -ErrorAction SilentlyContinue
          $voiceOk = $htsVoices.Count -gt 0

          Write-Host "jtalk.dll : $dllOk"
          Write-Host "辞書      : $dicOk"
          Write-Host "音声モデル: $voiceOk ($($htsVoices.Count) ファイル)"

          if (-not ($dllOk -and $dicOk -and $voiceOk)) {
            Write-Host "::warning::OpenJTalk ランタイムファイルが不足しています。RequiresEngine テストをスキップします。"
            Write-Host "::warning::音声モデルのダウンロード失敗は SourceForge Cloudflare 制限が原因の可能性があります（backlog #49 参照）。"
            echo "files_ok=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "files_ok=true" >> $env:GITHUB_OUTPUT
          }

      - name: テストプロジェクトをビルド（Content コピーを含む）
        if: steps.check-files.outputs.files_ok == 'true'
        run: |
          dotnet restore TxtToVoice.Tests/TxtToVoice.Tests.csproj
          dotnet build   TxtToVoice.Tests/TxtToVoice.Tests.csproj -c Release --no-restore

      - name: RequiresEngine テスト実行（OpenJTalk 実機）
        if: steps.check-files.outputs.files_ok == 'true'
        run: |
          dotnet test TxtToVoice.Tests/TxtToVoice.Tests.csproj `
            -c Release --no-restore --no-build `
            --filter "Category=RequiresEngine" `
            --logger "console;verbosity=normal"

      - name: セットアップ失敗時のサマリー
        if: steps.check-files.outputs.files_ok != 'true'
        run: |
          echo "## OpenJTalk セットアップ未完了" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "RequiresEngine テストはスキップされました。" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 原因の可能性" >> $env:GITHUB_STEP_SUMMARY
          echo "- SourceForge の Cloudflare JS チャレンジにより音声モデルのダウンロードが失敗した" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 対処" >> $env:GITHUB_STEP_SUMMARY
          echo "backlog #49 の配布自動化が完了するまでは、事前に voice ファイルを" >> $env:GITHUB_STEP_SUMMARY
          echo "\`poc/OpenJTalkPoC/Data/openjtalk/voice/\` に手動配置してから再実行してください。" >> $env:GITHUB_STEP_SUMMARY
