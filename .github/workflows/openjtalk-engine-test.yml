name: OpenJTalk Engine Tests

# RequiresEngine テストは jtalk.dll・辞書・音声モデルの実ファイルが必要なため
# 通常の build.yml とは分離して手動トリガー + 週次スケジュールで実行する。
#
# セットアップは tools/setup_openjtalk.ps1 を使用する（配布向けスクリプトと共通）。
# SourceForge の Cloudflare 制限により音声モデルの自動ダウンロードが
# 失敗する場合がある。その際はテストがスキップ扱いになる（失敗ではない）。
# 対処は backlog #49 を参照。

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "キャッシュを無視して jtalk.dll を再ビルドする"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 1"  # 毎週月曜 02:00 UTC

jobs:
  openjtalk-engine-test:
    name: OpenJTalk RequiresEngine Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # jtalkdll ビルド成果物をキャッシュ（キーを tools/setup_openjtalk.ps1 のハッシュに統一）
      - name: jtalkdll ビルドキャッシュ復元
        id: cache-jtalk
        uses: actions/cache@v4
        if: ${{ !inputs.skip_cache }}
        with:
          path: ~/openjtalk-setup
          key: jtalkdll-build-${{ runner.os }}-${{ hashFiles('tools/setup_openjtalk.ps1') }}

      # 音声モデル（MMDAgent zip）をキャッシュ
      # SourceForge ダウンロードに成功した場合のみキャッシュが作成される
      - name: 音声モデルキャッシュ復元
        id: cache-voice
        uses: actions/cache@v4
        if: ${{ !inputs.skip_cache }}
        with:
          path: ~/openjtalk-setup/MMDAgent_Example-1.8.zip
          key: mmdagent-zip-1.8

      - name: OpenJTalk セットアップ（jtalk.dll・辞書・音声モデル）
        id: setup
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\tools\setup_openjtalk.ps1
        # SourceForge Cloudflare ブロックで音声モデルダウンロードに失敗した場合は
        # continue-on-error により後続のファイル存在確認ステップで判定する

      - name: セットアップ成果物を TxtToVoice/Data/openjtalk にコピー
        shell: pwsh
        run: |
          $srcData = "tools\Data\openjtalk"
          $dest    = "TxtToVoice\Data\openjtalk"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # jtalk.dll
          if (Test-Path "$srcData\jtalk.dll") {
            Copy-Item "$srcData\jtalk.dll" "$dest\jtalk.dll" -Force
            Write-Host "[OK] jtalk.dll"
          }
          # 依存 DLL
          Get-ChildItem "$srcData\*.dll" -Exclude "jtalk.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_ "$dest\$($_.Name)" -Force; Write-Host "[OK] $($_.Name)" }
          # MeCab 辞書
          if (Test-Path "$srcData\open_jtalk_dic_utf_8") {
            Copy-Item "$srcData\open_jtalk_dic_utf_8" $dest -Recurse -Force
            Write-Host "[OK] open_jtalk_dic_utf_8"
          }
          # HTS Voice
          if (Test-Path "$srcData\voice") {
            Copy-Item "$srcData\voice" $dest -Recurse -Force
            Write-Host "[OK] voice"
          }

      - name: 前提ファイル確認
        id: check-files
        shell: pwsh
        run: |
          $dllOk   = Test-Path "TxtToVoice\Data\openjtalk\jtalk.dll"
          $dicOk   = Test-Path "TxtToVoice\Data\openjtalk\open_jtalk_dic_utf_8\sys.dic"
          $htsVoices = Get-ChildItem "TxtToVoice\Data\openjtalk\voice\*.htsvoice" -Recurse -ErrorAction SilentlyContinue
          $voiceOk = $htsVoices.Count -gt 0

          $dllMark   = if ($dllOk)   { "✅" } else { "❌" }
          $dicMark   = if ($dicOk)   { "✅" } else { "❌" }
          $voiceMark = if ($voiceOk) { "✅ ($($htsVoices.Count) 件)" } else { "❌" }

          Write-Host "jtalk.dll : $dllOk"
          Write-Host "辞書      : $dicOk"
          Write-Host "音声モデル: $voiceOk ($($htsVoices.Count) ファイル)"

          if (-not ($dllOk -and $dicOk -and $voiceOk)) {
            Write-Host "::warning::OpenJTalk ランタイムファイルが不足しています。RequiresEngine テストをスキップします。"
            if (-not $dllOk)   { Write-Host "::warning::jtalk.dll が見つかりません。jtalkdll のビルドが失敗した可能性があります。" }
            if (-not $dicOk)   { Write-Host "::warning::MeCab 辞書が見つかりません。jtalkdll ビルド成果物の辞書コピーが失敗した可能性があります。" }
            if (-not $voiceOk) { Write-Host "::warning::音声モデルが見つかりません。SourceForge Cloudflare 制限によるダウンロード失敗の可能性があります（backlog #49b 参照）。" }
            echo "files_ok=false" >> $env:GITHUB_OUTPUT
            echo "dll_ok=$($dllOk.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            echo "dic_ok=$($dicOk.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            echo "voice_ok=$($voiceOk.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            echo "dll_mark=$dllMark" >> $env:GITHUB_OUTPUT
            echo "dic_mark=$dicMark" >> $env:GITHUB_OUTPUT
            echo "voice_mark=$voiceMark" >> $env:GITHUB_OUTPUT
          } else {
            echo "files_ok=true" >> $env:GITHUB_OUTPUT
          }

      - name: テストプロジェクトをビルド（Content コピーを含む）
        if: steps.check-files.outputs.files_ok == 'true'
        run: |
          dotnet restore TxtToVoice.Tests/TxtToVoice.Tests.csproj
          dotnet build   TxtToVoice.Tests/TxtToVoice.Tests.csproj -c Release --no-restore

      - name: RequiresEngine テスト実行（OpenJTalk 実機）
        id: run-tests
        if: steps.check-files.outputs.files_ok == 'true'
        shell: pwsh
        run: |
          $result = dotnet test TxtToVoice.Tests/TxtToVoice.Tests.csproj `
            -c Release --no-restore --no-build `
            --filter "Category=RequiresEngine" `
            --logger "console;verbosity=normal" `
            2>&1
          $result | Write-Host

          # 実行件数・スキップ件数をワークフローサマリーに出力
          $passed  = ($result | Select-String -Pattern "Passed:\s*(\d+)"  | Select-Object -Last 1)
          $failed  = ($result | Select-String -Pattern "Failed:\s*(\d+)"  | Select-Object -Last 1)
          $skipped = ($result | Select-String -Pattern "Skipped:\s*(\d+)" | Select-Object -Last 1)

          $pCount = if ($passed)  { ($passed.Matches.Groups[1].Value)  } else { "?" }
          $fCount = if ($failed)  { ($failed.Matches.Groups[1].Value)  } else { "?" }
          $sCount = if ($skipped) { ($skipped.Matches.Groups[1].Value) } else { "?" }

          $summary = @"
          ## RequiresEngine テスト結果
          | 結果 | 件数 |
          |------|------|
          | Passed  | $pCount |
          | Failed  | $fCount |
          | Skipped | $sCount |
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY

          # dotnet test が失敗していたらジョブを失敗扱いにする
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: セットアップ失敗時のサマリー
        if: steps.check-files.outputs.files_ok != 'true'
        shell: pwsh
        run: |
          $dllMark   = "${{ steps.check-files.outputs.dll_mark }}"
          $dicMark   = "${{ steps.check-files.outputs.dic_mark }}"
          $voiceMark = "${{ steps.check-files.outputs.voice_mark }}"

          $summary = @"
          ## OpenJTalk セットアップ未完了

          RequiresEngine テストはスキップされました。

          ### 前提ファイル状況

          | ファイル | 状況 | 復旧ヒント |
          |----------|------|-----------|
          | jtalk.dll | $dllMark | jtalkdll のビルドログを確認（CMake / MSVC エラー） |
          | MeCab 辞書 | $dicMark | jtalkdll ビルド成果物の dic/ を確認 |
          | 音声モデル (.htsvoice) | $voiceMark | SourceForge Cloudflare 制限の可能性（backlog #49b 参照） |

          ### 手動復旧手順
          事前に voice ファイルを `TxtToVoice/Data/openjtalk/voice/` に配置してから再実行してください。
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY
