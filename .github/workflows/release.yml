name: Release

on:
  # タグ push による自動リリース
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # GitHub Actions UI からの手動実行
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "プレリリースとして公開する"
        required: false
        type: boolean
        default: false

# 同一タグで複数のジョブが並走しないよう制御
# （workflow_dispatch が作成したタグが push.tags を再トリガーした場合でも二重実行しない）
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------
  # ジョブ 1: ビルド確認
  # -------------------------------------------------------
  build:
    name: Build check
    runs-on: windows-latest

    steps:
      # workflow_dispatch: 選択したブランチの最新コミットを checkout
      # push.tags      : タグのコミットを checkout（デフォルト動作）
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 依存パッケージ復元
        run: dotnet restore TxtToVoice/TxtToVoice.csproj

      - name: リリースビルド確認
        run: dotnet build TxtToVoice/TxtToVoice.csproj -c Release --no-restore

  # -------------------------------------------------------
  # ジョブ 2: 発行・リリース（ビルド成功時のみ実行）
  # -------------------------------------------------------
  publish:
    name: Publish & Release (win-x64)
    runs-on: windows-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: タグ名を決定
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # -------------------------------------------------------
      # PublishSingleFile=true で 1 つの EXE にまとめる
      # self-contained=true で .NET ランタイムを同梱（配布先に .NET 不要）
      # -------------------------------------------------------
      - name: シングル EXE を発行
        shell: pwsh
        run: |
          dotnet publish TxtToVoice/TxtToVoice.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish

      # -------------------------------------------------------
      # 配布 ZIP を作成
      # 内容: TxtToVoice.exe + Data/sample_dictionary.json
      #       + THIRD_PARTY_LICENSES.txt + tools/setup_openjtalk.ps1
      # -------------------------------------------------------
      - name: 配布 ZIP を作成
        shell: pwsh
        run: |
          $tag     = "${{ env.RELEASE_TAG }}"
          $zipName = "TxtToVoice-${tag}-win-x64.zip"

          # OpenJTalk セットアップスクリプトを publish フォルダにコピー（同梱）
          if (Test-Path "tools\setup_openjtalk.ps1") {
            Copy-Item "tools\setup_openjtalk.ps1" ".\publish\setup_openjtalk.ps1"
            Write-Host "setup_openjtalk.ps1 を同梱しました"
          }

          Compress-Archive -Path "./publish/*" -DestinationPath $zipName
          Write-Host "=== 配布ファイル ==="
          Get-ChildItem $zipName | Select-Object Name, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,1)}}

      # -------------------------------------------------------
      # GitHub Release を作成してZIPを添付
      #
      # 既にリリースが存在する場合はスキップ:
      #   workflow_dispatch が gh release create でタグを作成すると
      #   push.tags が再トリガーされる場合があるが、このチェックで無害化する。
      #
      # release-notes/<tag>.md があれば本文に使用、なければ自動生成。
      # -------------------------------------------------------
      # -------------------------------------------------------
      # 音声モデルを Release asset として取得・保持
      # 優先順位: 前バージョンの asset 転用 > SourceForge ダウンロード
      # continue-on-error: true — 失敗しても release 本体はブロックしない
      # CC BY 3.0: THIRD_PARTY_LICENSES.txt 同梱によりクレジット義務対応済み
      # -------------------------------------------------------
      - name: 音声モデル (mei_normal.htsvoice) を取得
        id: get-voice
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $meiFile = "mei_normal.htsvoice"

          # --- 方針1: 前バージョンの release asset を転用（最も確実）---
          $found = $false
          try {
            $releases = gh release list --limit 10 --json tagName,assets 2>$null | ConvertFrom-Json
            foreach ($rel in $releases) {
              if ($rel.tagName -eq "${{ env.RELEASE_TAG }}") { continue }
              $asset = $rel.assets | Where-Object { $_.name -eq $meiFile }
              if ($asset) {
                Write-Host "前バージョン $($rel.tagName) から転用します"
                gh release download $rel.tagName --asset $meiFile -D . --clobber 2>$null
                if ((Test-Path $meiFile) -and (Get-Item $meiFile).Length -gt 100000) {
                  $found = $true
                  Write-Host "[OK] 転用完了: $($rel.tagName) -> $meiFile"
                  break
                }
              }
            }
          } catch { Write-Host "[!!] 前バージョン asset 取得失敗: $_" }

          # --- 方針2: SourceForge からダウンロード（初回リリース時）---
          if (-not $found) {
            $tmpDir = Join-Path $env:USERPROFILE "voice-dl"
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            $mmdZip  = Join-Path $tmpDir "MMDAgent_Example-1.8.zip"
            $mmdWork = Join-Path $tmpDir "MMDAgent_Example-1.8"
            $headers = @{ 'User-Agent' = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' }

            foreach ($url in @(
              "https://jaist.dl.sourceforge.net/project/mmdagent/MMDAgent_Example/MMDAgent_Example-1.8/MMDAgent_Example-1.8.zip",
              "https://downloads.sourceforge.net/project/mmdagent/MMDAgent_Example/MMDAgent_Example-1.8/MMDAgent_Example-1.8.zip",
              "https://umnmirror.dl.sourceforge.net/project/mmdagent/MMDAgent_Example/MMDAgent_Example-1.8/MMDAgent_Example-1.8.zip"
            )) {
              try {
                Write-Host "SourceForge ダウンロード試行: $url"
                Invoke-WebRequest -Uri $url -OutFile $mmdZip -UseBasicParsing -MaximumRedirection 10 -Headers $headers
                if ((Test-Path $mmdZip) -and (Get-Item $mmdZip).Length -gt 1MB) { break }
              } catch { Write-Host "  失敗: $_" }
            }

            if ((Test-Path $mmdZip) -and (Get-Item $mmdZip).Length -gt 1MB) {
              Expand-Archive -Path $mmdZip -DestinationPath $tmpDir -Force
              $hts = Get-ChildItem $mmdWork -Filter $meiFile -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hts) {
                Copy-Item $hts.FullName $meiFile -Force
                $found = $true
                Write-Host "[OK] SourceForge から取得: $meiFile"
              }
            }
          }

          if ($found -and (Test-Path $meiFile)) {
            echo "MEI_VOICE_READY=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "::warning::$meiFile の取得に失敗。release asset には含まれません。"
          }

      - name: GitHub Release を作成
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          ZIP="TxtToVoice-${TAG}-win-x64.zip"
          TITLE="声の広報 テキスト読み上げツール ${TAG}"
          NOTES_FILE="release-notes/${TAG}.md"

          # 既にリリースが存在する場合はスキップ
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "リリース $TAG は既に存在します。スキップします。"
            exit 0
          fi

          EXTRA_FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi

          # mei_normal.htsvoice が取得済みなら ZIP と一緒に添付
          EXTRA_ASSETS=""
          if [ "$MEI_VOICE_READY" = "true" ] && [ -f "mei_normal.htsvoice" ]; then
            EXTRA_ASSETS="mei_normal.htsvoice"
            echo "mei_normal.htsvoice を release asset として添付します"
          fi

          if [ -f "$NOTES_FILE" ]; then
            echo "リリースノートファイルを使用: $NOTES_FILE"
            gh release create "$TAG" "$ZIP" $EXTRA_ASSETS \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              $EXTRA_FLAGS
          else
            echo "リリースノートを自動生成します"
            gh release create "$TAG" "$ZIP" $EXTRA_ASSETS \
              --title "$TITLE" \
              --generate-notes \
              $EXTRA_FLAGS
          fi
