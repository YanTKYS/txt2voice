name: Release

on:
  # タグ push による自動リリース
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # GitHub Actions UI からの手動実行
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "プレリリースとして公開する"
        required: false
        type: boolean
        default: false

# 同一タグで複数のジョブが並走しないよう制御
# （workflow_dispatch が作成したタグが push.tags を再トリガーした場合でも二重実行しない）
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------
  # ジョブ 1: ビルド確認
  # -------------------------------------------------------
  build:
    name: Build check
    runs-on: windows-latest

    steps:
      # workflow_dispatch: 選択したブランチの最新コミットを checkout
      # push.tags      : タグのコミットを checkout（デフォルト動作）
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 依存パッケージ復元
        run: dotnet restore TxtToVoice/TxtToVoice.csproj

      - name: リリースビルド確認
        run: dotnet build TxtToVoice/TxtToVoice.csproj -c Release --no-restore

  # -------------------------------------------------------
  # ジョブ 2: 発行・リリース（ビルド成功時のみ実行）
  # -------------------------------------------------------
  publish:
    name: Publish & Release (win-x64)
    runs-on: windows-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: タグ名を決定
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # -------------------------------------------------------
      # PublishSingleFile=true で 1 つの EXE にまとめる
      # self-contained=true で .NET ランタイムを同梱（配布先に .NET 不要）
      # -------------------------------------------------------
      - name: シングル EXE を発行
        shell: pwsh
        run: |
          dotnet publish TxtToVoice/TxtToVoice.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish

      # -------------------------------------------------------
      # 配布 ZIP を作成
      # 内容: TxtToVoice.exe + Data/sample_dictionary.json
      # -------------------------------------------------------
      - name: 配布 ZIP を作成
        shell: pwsh
        run: |
          $tag     = "${{ env.RELEASE_TAG }}"
          $zipName = "TxtToVoice-${tag}-win-x64.zip"
          Compress-Archive -Path "./publish/*" -DestinationPath $zipName
          Write-Host "=== 配布ファイル ==="
          Get-ChildItem $zipName | Select-Object Name, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,1)}}

      # -------------------------------------------------------
      # GitHub Release を作成してZIPを添付
      #
      # 既にリリースが存在する場合はスキップ:
      #   workflow_dispatch が gh release create でタグを作成すると
      #   push.tags が再トリガーされる場合があるが、このチェックで無害化する。
      #
      # release-notes/<tag>.md があれば本文に使用、なければ自動生成。
      # -------------------------------------------------------
      - name: GitHub Release を作成
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          ZIP="TxtToVoice-${TAG}-win-x64.zip"
          TITLE="声の広報 テキスト読み上げツール ${TAG}"
          NOTES_FILE="release-notes/${TAG}.md"

          # 既にリリースが存在する場合はスキップ
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "リリース $TAG は既に存在します。スキップします。"
            exit 0
          fi

          EXTRA_FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi

          if [ -f "$NOTES_FILE" ]; then
            echo "リリースノートファイルを使用: $NOTES_FILE"
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              $EXTRA_FLAGS
          else
            echo "リリースノートを自動生成します"
            gh release create "$TAG" "$ZIP" \
              --title "$TITLE" \
              --generate-notes \
              $EXTRA_FLAGS
          fi
