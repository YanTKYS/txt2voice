name: Build

on:
  push:
    branches:
      - main
      - develop
      - "claude/**"
  pull_request:
    branches:
      - main


jobs:
  # -------------------------------------------------------
  # レーン A: 純ロジックテスト（OS 非依存・全 PR 必須）
  # TxtToVoice.Core.Tests は net8.0 のため Linux runner で実行可能
  # -------------------------------------------------------
  test-core:
    name: Core Logic Tests (net8.0 / ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Core テストプロジェクト復元
        run: dotnet restore TxtToVoice.Core.Tests/TxtToVoice.Core.Tests.csproj

      - name: 純ロジックテスト実行
        run: dotnet test TxtToVoice.Core.Tests/TxtToVoice.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

  # -------------------------------------------------------
  # レーン B: ビルド確認 + Windows 依存テスト（エンジン系除外）
  # RequiresEngine テストはエンジン不在の CI では除外する
  # -------------------------------------------------------
  build:
    name: Build & Test (Windows / .NET 8)
    runs-on: windows-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: .NET 8 SDK セットアップ
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: 依存パッケージ復元
        run: dotnet restore TxtToVoice/TxtToVoice.csproj

      - name: リリースビルド
        run: dotnet build TxtToVoice/TxtToVoice.csproj -c Release --no-restore

      - name: テストプロジェクト復元
        run: dotnet restore TxtToVoice.Tests/TxtToVoice.Tests.csproj

      - name: Windows 依存テスト実行（RequiresEngine 除外）
        run: dotnet test TxtToVoice.Tests/TxtToVoice.Tests.csproj -c Release --no-restore --filter "Category!=RequiresEngine" --logger "console;verbosity=normal"

      # ビルド成果物（フレームワーク依存 EXE）を確認用にアップロード
      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.sha }}
          path: TxtToVoice/bin/Release/net8.0-windows/
          retention-days: 7
